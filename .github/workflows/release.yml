name: Release

# Push a tag like v0.1.0 to build installers for every platform and publish a release.
# "Run workflow" on the Actions tab builds them without publishing (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux
          - os: macos-14 # Apple Silicon runner
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no signing certificates yet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: desktop

      - run: npm run dist -- ${{ matrix.target }}
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: stek-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
            desktop/release/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
